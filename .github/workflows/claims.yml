name: claims
on:
  push:
    branches: [main]
    paths: ["claims/**", "docs/**", "tools/**", "README.md", "REPRODUCE.md"]
  pull_request:
    paths: ["claims/**", "docs/**", "tools/**", "README.md", "REPRODUCE.md"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Registry and checker unit tests
        run: python3 -m unittest discover -s claims
      - name: Check headline claims against the other repos' committed outputs
        run: python3 claims/check_claims.py
      - name: Headline numbers agree across README, site and papers
        run: |
          python3 -m unittest tools.test_check_consistency tools.test_references_ledger tools.test_figures
          python3 tools/check_consistency.py
      - name: Figures and numeric tables regenerate from committed data
        run: python3 tools/regenerate_figures.py
